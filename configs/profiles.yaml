# Run sizes. Only sizes: a profile never changes which stages run or what they
# report, so a quick run and a server run are the same experiment at different
# scales.
#
#   python main.py --profile quick
#
# These lived in main.py as four dicts of fifteen keys, a fourth parameter table
# alongside the config, the two CLIs, and PPOConfig. Note `fraud_rate`: it
# overrides the configured engine.fraud_base_rate of 0.005 by between two and
# twelve times, so on a profiled run the YAML value never applies. That is
# deliberate — a 0.5% base rate needs an impractically large population to
# yield enough positives — but it was invisible while it lived in Python.
#
# Each key is the command-line flag the pipeline passes to the stage that owns
# it, so a profile is exactly "what main.py would have typed for you". Anything
# absent here keeps whatever configs/simulation.yaml says.

# A fast smoke of every stage, about ten minutes. Small enough that the numbers
# mean nothing; large enough that a broken stage fails.
quick:
  holders: 600
  fraud_rate: 0.06
  per_key: 25
  demo_episodes: 40
  bc_epochs: 6
  critic_rollouts: 16
  critic_epochs: 8
  updates: 12
  episodes_per_update: 12
  refit_every: 4
  hidden: 128
  minibatch: 128
  embed_dim: 256
  label_latency: 2880
  fraud_rounds: 3
  target_prevalence: 0.02

# A real run, one to two hours.
default:
  holders: 3000
  fraud_rate: 0.02
  per_key: 150
  demo_episodes: 300
  bc_epochs: 10
  critic_rollouts: 48
  critic_epochs: 20
  updates: 60
  episodes_per_update: 48
  refit_every: 10
  hidden: 256
  minibatch: 256
  embed_dim: 256
  label_latency: 4320
  fraud_rounds: 4
  target_prevalence: 0.02

# A middle size: sixty updates at a refit every six gives ten refit points, most
# of the arms-race curve, on half the population.
#
# This profile was added to dodge a projected forty-hour server run, estimated at
# ~19 min per update before anything had been measured. The measurement came in
# at 22 seconds per update -- the whole server profile finished in 63.7 min --
# so the estimate was wrong by roughly fifty times and the schedule pressure it
# was avoiding never existed. The profile stays because a smaller run is still
# useful; it is no longer the one to reach for on time grounds.
gpu:
  holders: 6000
  fraud_rate: 0.02
  per_key: 300
  demo_episodes: 400
  bc_epochs: 12
  critic_rollouts: 64
  critic_epochs: 25
  updates: 60
  episodes_per_update: 32
  refit_every: 6
  hidden: 256
  minibatch: 256
  embed_dim: 256
  label_latency: 4320
  fraud_rounds: 4
  target_prevalence: 0.02

# The full thing, and the profile that produced every headline number. Measured
# at 63.7 min end to end on the GPU box (12,000 holders, 150 updates, 12 refits),
# with the text pool already built -- which it is in a fresh clone, since the
# pool ships in artifacts/.
server:
  holders: 12000
  fraud_rate: 0.01
  per_key: 500
  demo_episodes: 800
  bc_epochs: 15
  critic_rollouts: 128
  critic_epochs: 40
  updates: 150
  episodes_per_update: 80
  refit_every: 12
  hidden: 512
  minibatch: 512
  embed_dim: 256
  label_latency: 4320
  fraud_rounds: 4
  target_prevalence: 0.02
