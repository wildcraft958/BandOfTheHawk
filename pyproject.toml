[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudsim"
version = "0.1.0"
description = "Entity-graph world model and simulator for payment fraud research"
requires-python = ">=3.13"

# Runtime tier. Deliberately excludes pandas/pyarrow/networkx so that a stray
# import in the simulation path fails in a clean install instead of silently
# resolving against a globally installed copy.
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "pydantic>=2.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = ["networkx>=3.6", "matplotlib>=3.10"]
calibration = ["pandas>=2.2", "pyarrow>=17.0"]
# Learned tiers, each isolated from the numpy-only simulation path by the import
# firewall (tests/test_import_firewall.py). The defender's feature extraction is
# numpy; only the models it fits reach into these.
defender = ["scikit-learn>=1.5", "lightgbm>=4.5"]
rl = ["torch>=2.4"]
generative = ["torch>=2.4", "transformers>=4.44", "accelerate>=0.34"]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["fraudsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
