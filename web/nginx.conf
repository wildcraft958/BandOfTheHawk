server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml text/html;

  # One self-contained page, hash-routed: every path resolves to index.html.
  location / {
    try_files $uri /index.html;
    # A judge who rebuilds must never be served a stale page.
    add_header Cache-Control "no-store";
  }
}
