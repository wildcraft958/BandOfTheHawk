<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 200" width="1210" height="200" role="img" aria-label="The six pipeline stages in order: demo, text, fraud, baseline, mixture, coadapt">
  <title>GAUNTLET pipeline</title>
  <desc>demo builds the world, text generates and embeds the corpus, fraud injects episodes, baseline fits a flat gradient-boosted detector, mixture fits five experts and a combiner, and coadapt runs the closed loop.</desc>

  <style>
    .card  { fill: #101013; stroke-width: 1.5; rx: 10; }
    .name  { font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e8e8ea; }
    .sub   { font: 400 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #9a9aa2; }
    .cap   { font: 400 11.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6f6f78; }
    .flow  { stroke: #3a3a42; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a42"/>
    </marker>
  </defs>

  <rect width="1210" height="200" fill="#0a0a0b"/>

  <!-- demo -->
  <rect class="card" x="20"   y="48" width="170" height="86" stroke="#3f3f47"/>
  <text class="name" x="105"  y="88"  text-anchor="middle">demo</text>
  <text class="sub"  x="105"  y="110" text-anchor="middle">build world</text>

  <!-- text -->
  <rect class="card" x="220"  y="48" width="170" height="86" stroke="#a855f7"/>
  <text class="name" x="305"  y="88"  text-anchor="middle">text</text>
  <text class="sub"  x="305"  y="110" text-anchor="middle">generate + embed</text>

  <!-- fraud -->
  <rect class="card" x="420"  y="48" width="170" height="86" stroke="#e5484d"/>
  <text class="name" x="505"  y="88"  text-anchor="middle">fraud</text>
  <text class="sub"  x="505"  y="110" text-anchor="middle">inject episodes</text>

  <!-- baseline -->
  <rect class="card" x="620"  y="48" width="170" height="86" stroke="#3b82f6"/>
  <text class="name" x="705"  y="88"  text-anchor="middle">baseline</text>
  <text class="sub"  x="705"  y="110" text-anchor="middle">flat GBDT</text>

  <!-- mixture -->
  <rect class="card" x="820"  y="48" width="170" height="86" stroke="#3b82f6"/>
  <text class="name" x="905"  y="88"  text-anchor="middle">mixture</text>
  <text class="sub"  x="905"  y="110" text-anchor="middle">five experts</text>

  <!-- coadapt -->
  <rect class="card" x="1020" y="48" width="170" height="86" stroke="#f59e0b"/>
  <text class="name" x="1105" y="88"  text-anchor="middle">coadapt</text>
  <text class="sub"  x="1105" y="110" text-anchor="middle">closed loop</text>

  <!-- flow -->
  <path class="flow" d="M 192 91 L 216 91" marker-end="url(#a)"/>
  <path class="flow" d="M 392 91 L 416 91" marker-end="url(#a)"/>
  <path class="flow" d="M 592 91 L 616 91" marker-end="url(#a)"/>
  <path class="flow" d="M 792 91 L 816 91" marker-end="url(#a)"/>
  <path class="flow" d="M 992 91 L 1016 91" marker-end="url(#a)"/>

  <text class="cap" x="20"   y="168">world and calibration</text>
  <text class="cap" x="420"  y="168">red team</text>
  <text class="cap" x="620"  y="168">static benchmarks</text>
  <text class="cap" x="1020" y="168">the solution</text>
</svg>
